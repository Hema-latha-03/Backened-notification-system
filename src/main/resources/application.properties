spring.application.name=notification-engine
server.port=8080

# ---- MySQL (change username/password) ----
spring.datasource.url=jdbc:mysql://localhost:3306/notification_engine_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD
spring.config.import=optional:classpath:application-local.properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Engine settings ----
notification.admin-key=admin-secret-123
notification.max-retries=4
notification.retry.base-delay-seconds=10
notification.worker.poll-ms=5000
notification.worker.batch-size=20
# Mock senders fail randomly so you can see retries (0.0 = never fail, 1.0 = always fail)
notification.mock.failure-rate=0.4
